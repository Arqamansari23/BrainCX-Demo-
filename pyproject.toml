[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "VoiceCRM: a small CRM with a LiveKit voice agent that updates it"
requires-python = ">=3.10, <3.15"

dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "livekit-agents[google]~=1.8",
    "python-dotenv",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # FastAPI declares dependencies as Depends() defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
